name: Update Starred Repos

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update starred repos
        uses: simonw/stars-readme-action@v1
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          count: 10
