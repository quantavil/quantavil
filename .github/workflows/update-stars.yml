name: Update Starred Repos

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch starred repos and update README
        run: |
          python3 -c "
          import urllib.request, json, re

          url = 'https://api.github.com/users/quantavil/starred?per_page=10'
          req = urllib.request.Request(url, headers={'User-Agent': 'Python'})
          try:
              with urllib.request.urlopen(req) as resp:
                  repos = json.loads(resp.read().decode('utf-8'))
          except Exception as e:
              print(f'Error fetching stars: {e}')
              repos = []

          lines = []
          for r in repos:
              name = r.get('full_name', '')
              desc = r.get('description') or ''
              url = r.get('html_url', '')
              if desc:
                  lines.append(f'- [{name}]({url}) — {desc}')
              else:
                  lines.append(f'- [{name}]({url})')

          stars_content = '\n'.join(lines) if lines else 'No starred repos found.'

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          new_content = re.sub(
              r'<!-- STARS:START -->.*?<!-- STARS:END -->',
              f'<!-- STARS:START -->\n{stars_content}\n<!-- STARS:END -->',
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "auto update starred repos" && git push)
